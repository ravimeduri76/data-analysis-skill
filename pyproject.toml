[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-skill"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
timeseries = ["statsmodels>=0.14"]
memory = ["psycopg2-binary>=2.9"]

[tool.setuptools]
packages = ["hooks"]
py-modules = ["loader", "profiler", "classifier", "sanitizer"]
